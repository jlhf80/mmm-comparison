[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmm-comparison"
version = "0.1.0"
description = "Comparison of Robyn, PyMC-Marketing, and a DLM on a time-varying-coefficient MMM DGP."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pymc>=5.10",
    "pymc-marketing>=0.5",
    "nevergrad>=1.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
include = ["dgp*", "models*", "simulation*", "visualization*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# `X` (design matrix), `T` (time), and `beta_at_T` are conventional in MMM / sklearn.
"models/base.py" = ["N802", "N803"]
"models/robyn_model.py" = ["N802", "N803", "N806"]
"models/pymc_model.py" = ["N802", "N803", "N806"]
"models/dlm_model.py" = ["N802", "N803", "N806"]
"tests/test_kalman.py" = ["N802", "N803", "N806"]
# `beta_T`, `true_beta_T`, `beta_T_hat` — `T` marks the terminal time index.
"simulation/results.py" = ["N815"]
"simulation/runner.py" = ["N806"]
"tests/test_runner.py" = ["N802"]
"tests/test_robyn.py" = ["N802", "N806"]
"tests/test_pymc.py" = ["N802", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
