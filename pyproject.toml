[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmm-comparison"
version = "0.1.0"
description = "Comparison of Robyn, PyMC-Marketing, and a DLM on a time-varying-coefficient MMM DGP."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pymc>=5.10",
    "pymc-marketing>=0.5",
    "nevergrad>=1.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
include = ["dgp*", "models*", "simulation*", "visualization*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
